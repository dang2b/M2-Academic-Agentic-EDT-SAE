name: sae

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sae}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sae}
      POSTGRES_DB: ${POSTGRES_DB:-sae}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        REQUIREMENTS: requirements-dev.txt
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sae}:${POSTGRES_PASSWORD:-sae}@db:5432/${POSTGRES_DB:-sae}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # Local demo account only: never set these on the VPS
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-admin@example.com}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-admin1234}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    # Dev : code monté en volume + rechargement à chaud
    volumes:
      - ./backend:/app
    command: sh -c "alembic upgrade head && python -m seed && exec uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

  # Interface web pour explorer la base : docker compose --profile tools up
  adminer:
    image: adminer
    profiles: ["tools"]
    depends_on:
      - db
    ports:
      - "${ADMINER_PORT:-8080}:8080"

  # --- Ajoutez votre front ici (propre à chaque fork), par exemple :
  # frontend:
  #   build: ./frontend
  #   ports:
  #     - "5173:5173"
  #   depends_on:
  #     - backend

volumes:
  pgdata:
